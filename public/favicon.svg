<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Gate-all-around FET glyph">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" />
      <stop offset="1" stop-color="#6366F1" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#050816" />
  <!-- source / drain rails -->
  <rect x="8" y="18" width="7" height="28" rx="2" fill="#94A3B8" opacity=".75" />
  <rect x="49" y="18" width="7" height="28" rx="2" fill="#94A3B8" opacity=".75" />
  <!-- wrapped nanosheet channels -->
  <rect x="15" y="21" width="34" height="6" rx="3" fill="none" stroke="url(#g)" stroke-width="2.5" />
  <rect x="15" y="29" width="34" height="6" rx="3" fill="none" stroke="url(#g)" stroke-width="2.5" />
  <rect x="15" y="37" width="34" height="6" rx="3" fill="none" stroke="url(#g)" stroke-width="2.5" />
  <!-- gate -->
  <rect x="26" y="12" width="12" height="40" rx="5" fill="none" stroke="#A78BFA" stroke-width="2.5" opacity=".9" />
</svg>
